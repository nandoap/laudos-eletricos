<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Painel Eng. Leandro Aparecido</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #111827 0, #020617 50%, #020617 100%);
      color: #e5e7eb;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #020617;
      border-radius: 12px;
      border: 1px solid #1f2937;
      padding: 18px 20px 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }
    h1 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    p {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    input {
      width: 100%;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.8rem;
      outline: none;
    }
    input::placeholder { color: rgba(148,163,184,0.7); }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px rgba(59,130,246,0.5);
    }
    .field { margin-bottom: 10px; }
    button {
      width: 100%;
      border-radius: 999px;
      padding: 8px 0;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #2563eb; }
    .error {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #fca5a5;
      min-height: 1em;
    }
    .info {
      margin-top: 10px;
      font-size: 0.7rem;
      color: #9ca3af;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #22c55e 70%, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(37,99,235,0.7);
      font-size: 15px;
    }
    .brand-sub {
      font-size: 0.7rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-icon">L</div>
    <div>
      <div>Eng. Leandro Aparecido</div>
      <div class="brand-sub">Painel administrativo</div>
    </div>
  </div>

  <h1>Entrar no painel</h1>
  <p>Use o e-mail e senha cadastrados no Firebase Authentication.</p>

  <form id="loginForm">
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required placeholder="seuemail@exemplo.com">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required placeholder="Sua senha">
    </div>
    <button type="submit">Entrar</button>
    <div id="loginError" class="error"></div>
  </form>

  <div class="info">
    Dica: crie e gerencie usuários em<br>Firebase Console &gt; Authentication &gt; Users.
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

  // COLE AQUI SEU firebaseConfig
  const firebaseConfig = {
    apiKey: "AIzaSyBDUacZA7KSmeSkqQdB9YyUomK2_hX7lUQ",
    authDomain: "laudos-leandro.firebaseapp.com",
    projectId: "laudos-leandro",
    storageBucket: "laudos-leandro.firebasestorage.app",
    messagingSenderId: "561026492419",
    appId: "1:561026492419:web:7242bfb9933f5212c1c636"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "admin.html";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.textContent = "";
    const email = form.email.value.trim();
    const senha = form.senha.value;

    try {
      await signInWithEmailAndPassword(auth, email, senha);
      window.location.href = "admin.html";
    } catch (err) {
      console.error(err);
      let msg = "Erro ao entrar. Verifique e-mail e senha.";
      if (err.code === "auth/user-not-found") msg = "Usuário não encontrado.";
      if (err.code === "auth/wrong-password") msg = "Senha incorreta.";
      if (err.code === "auth/too-many-requests") msg = "Muitas tentativas. Tente novamente em alguns minutos.";
      errorBox.textContent = msg;
    }
  });
</script>
</body>
</html>
